# ===========================================================================
# 拒否確認用 Route（workload）
#
# 概要: workload AppProject の namespaceResourceBlacklist に該当する Route を定義する。
# 目的: ArgoCD がこの Route を作成できない（AppProject の blacklist で拒否される）ことを確認する。
# 備考: 同じ Application で同期されるが、Route だけが not permitted として拒否される。
# ===========================================================================
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sample-deny-test
spec:
  to:
    kind: Service
    name: sample
  port:
    targetPort: 8080
