# ===========================================================================
# サンプルアプリ Service
#
# 概要: サンプルアプリへの ClusterIP を定義する。
# 目的: 展開されたアプリに Service 経由で到達できることを確認する。
# ===========================================================================
apiVersion: v1
kind: Service
metadata:
  name: sample
spec:
  selector:
    app: sample
  ports:
    - port: 8080
      targetPort: 8080
