# ===========================================================================
# 拒否確認用 Deployment（CI/CD）
#
# 概要: CI/CD AppProject の namespaceResourceWhitelist（Tekton のみ）に該当しない
#       Deployment を定義する。
# 目的: ArgoCD がこの Deployment を作成できない（whitelist 外のため拒否される）ことを確認する。
# 備考: 同じ Application で同期されるが、Deployment だけが not permitted として拒否される。
#       restricted の Pod Security に適合させるため非 root・非特権で起動する。
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-deny-test
  labels:
    app: sample-deny-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-deny-test
  template:
    metadata:
      labels:
        app: sample-deny-test
    spec:
      containers:
        - name: nginx
          # イメージ固定：latest を避け、タグでバージョンを固定する
          image: registry.access.redhat.com/ubi9/nginx-124:1-14
          # 起動コマンド：UBI nginx をフォアグラウンドで実行する
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - containerPort: 8080
          # 権限制限：restricted の Pod Security に適合させる
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
